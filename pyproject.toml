[project]
name = "typerbot"
version = "2.0.0"
description = "TyperBot - Discord bot for football predictions"
requires-python = ">=3.13"
authors = [
    {name = "adrunkhuman"}
]
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.2",
    "aiosqlite>=0.22.1",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "freezegun>=1.5.5",
    "ty>=0.0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typer_bot"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ASYNC", "RET", "PTH", "ARG", "ERA"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
# Astral's type checker (ty) configuration
python-version = "3.13"
# Add any type-specific ignores here once we start fixing errors
# ignore = ["unresolved-attribute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
